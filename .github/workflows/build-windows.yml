name: Build (Windows)

on:
  push:
    branches: [ "elevatordp-door", "master" ]
  pull_request:
    branches: [ "elevatordp-door", "master" ]

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ Win32, x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution
        shell: cmd
        run: premake5.exe vs2022

      - name: Build
        shell: cmd
        run: |
          msbuild OpenParrot.sln ^
            /p:Configuration=Release ^
            /p:Platform=${{ matrix.platform }} ^
            /m ^
            /verbosity:minimal

      - name: Upload EADPDoorOverlay + EADPDoorHook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EADP-Door-Overlay-${{ matrix.platform }}
          # The hook DLL is only produced for Win32; the overlay is built for both
          path: |
            build/bin/release/EADPDoorOverlay.exe
            build/bin/release/EADPDoorHook.dll
          if-no-files-found: warn

      - name: Upload full build output
        uses: actions/upload-artifact@v4
        with:
          name: OpenParrot-${{ matrix.platform }}
          path: build/bin/release/output/
          if-no-files-found: warn
